name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install unit-test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run offline backend tests
        run: python -m pytest tests -q
      - name: Validate scenario dataset without model calls
        run: python -m evaluation.scenario_runner --mode validate
      - name: Install optional telemetry SDK for local contract tests
        run: python -m pip install -r requirements-observability.txt
      - name: Verify real telemetry SDK without external services
        run: python -m pytest tests/test_telemetry_sdk_contract.py -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
